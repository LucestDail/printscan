# printscan — edge/cloud 서브도메인 vhost (nip.io). 호스트 루트=앱 → 절대경로 100% 동작(앱 무변경).
# 배치: /etc/nginx/sites-enabled/printscan.conf  후 nginx -t && systemctl reload nginx
# 랜딩 페이지(/printscan/)는 gateway.conf 의 기존 static location 이 /var/www/printscan/ 를 서빙.

upstream uPsEdge { server 127.0.0.1:8091; keepalive 16; }
upstream uPsHub  { server 127.0.0.1:8092; keepalive 16; }

# 허브(관리 대시보드) — cloud:8092
server {
  listen 80;
  listen [::]:80;
  server_name printscan-hub.192.168.11.25.nip.io;
  client_max_body_size 50m;
  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 300s;
  location / { proxy_pass http://uPsHub; }
}

# 엣지(라인 유닛 UI) — edge:8091 (HTTP Basic 인증은 브라우저가 프롬프트)
server {
  listen 80;
  listen [::]:80;
  server_name printscan-edge.192.168.11.25.nip.io;
  client_max_body_size 50m;
  proxy_http_version 1.1;
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;
  proxy_read_timeout 300s;
  location / { proxy_pass http://uPsEdge; }
}
