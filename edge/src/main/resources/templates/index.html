<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="#{index.title}">printscan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link th:href="@{/design/tokens.css}" rel="stylesheet">
  <link th:href="@{/design/components.css}" rel="stylesheet">
  <style>
    .wrap { max-width: var(--content-max); margin: 0 auto; padding: var(--space-lg); }
    .status { display:grid; grid-template-columns: repeat(4,1fr); gap: var(--space-lg); margin-bottom: var(--space-lg); }
    @media (max-width:800px){ .status{grid-template-columns:repeat(2,1fr);} }
    .stat { background: var(--color-canvas); border: var(--border-hairline); border-radius: var(--radius-lg); padding: var(--space-lg); }
    .stat .n { font-family: var(--font-display); font-size: 32px; font-weight: 600; }
    .stat .l { color: var(--color-ink-muted-48); font-size: var(--t-caption-size); }
    .cards { display:grid; grid-template-columns: repeat(3,1fr); gap: var(--space-lg); }
    @media (max-width:800px){ .cards{grid-template-columns:1fr;} }
    .feature { display:block; text-decoration:none; color:var(--color-ink); background: var(--color-canvas);
               border: var(--border-hairline); border-radius: var(--radius-lg); padding: var(--space-xl); transition: transform .1s ease; }
    .feature:active { transform: scale(0.99); }
    .feature .ic { font-size: 30px; }
    .feature h3 { margin: var(--space-sm) 0 4px; font-size: var(--t-tagline-size); font-weight:600; }
    .feature p { margin:0; color: var(--color-ink-muted-48); font-size: var(--t-caption-size); }
    .dot { width:8px; height:8px; border-radius:50%; background:#2ecc71; display:inline-block; margin-right:6px; }
    .lang a { color: var(--color-primary); text-decoration:none; font-size: var(--t-nav-link-size); }
    .lang a.on { font-weight:600; text-decoration:underline; }
  </style>
</head>
<body>

<nav class="global-nav">
  <strong style="font-size:14px;">▪ printscan</strong>
  <a th:href="@{/}" th:text="#{nav.home}">홈</a>
  <a th:href="@{/designer}" th:text="#{nav.designer}">라벨 디자이너</a>
  <a th:href="@{/scan}" th:text="#{nav.scan}">스캔·재고</a>
  <span class="spacer"></span>
  <span class="lang">
    <a th:href="@{/(lang='ko')}" th:classappend="${#locale.language=='ko'}?'on'">KO</a>
    <span style="opacity:.4">·</span>
    <a th:href="@{/(lang='en')}" th:classappend="${#locale.language=='en'}?'on'">EN</a>
  </span>
</nav>

<section class="tile tile-light" style="padding: var(--space-xl) var(--space-lg);">
  <h1 class="t-display-lg headline" style="margin:0;" th:text="#{index.h1}">이 기기에서 라벨 관리</h1>
  <p class="t-lead tagline" style="margin:6px 0 0;" th:text="#{index.sub}">…</p>
</section>

<div class="wrap">
  <div class="status">
    <div class="stat"><div class="n" id="sLine">–</div><div class="l" th:text="#{index.stat.line}">라인</div></div>
    <div class="stat"><div class="n"><span class="dot"></span><span id="sPrinter">–</span></div><div class="l" th:text="#{index.stat.printer}">프린터</div></div>
    <div class="stat"><div class="n" id="sProducts">–</div><div class="l" th:text="#{index.stat.products}">등록 제품</div></div>
    <div class="stat"><div class="n" id="sLow">–</div><div class="l" th:text="#{index.stat.low}">재고 부족</div></div>
  </div>

  <div class="cards">
    <a class="feature" th:href="@{/designer}">
      <div class="ic">🏷️</div><h3 th:text="#{index.card.designer.title}">라벨 디자이너</h3>
      <p th:text="#{index.card.designer.desc}">…</p>
    </a>
    <a class="feature" th:href="@{/scan}">
      <div class="ic">📦</div><h3 th:text="#{index.card.scan.title}">스캔 · 재고</h3>
      <p th:text="#{index.card.scan.desc}">…</p>
    </a>
    <a class="feature" href="/h2-console" target="_blank">
      <div class="ic">🗄️</div><h3 th:text="#{index.card.admin.title}">점검</h3>
      <p th:text="#{index.card.admin.desc}">…</p>
    </a>
  </div>
</div>

<script th:inline="javascript">
  var READY = /*[[#{index.stat.line}]]*/ 'Line';
  fetch('/api/health').then(function(r){return r.json();}).then(function(h){
    document.getElementById('sLine').textContent = h.line || '-';
    document.getElementById('sPrinter').textContent = h.status === 'UP' ? '●' : '×';
    document.getElementById('sProducts').textContent = h.products != null ? h.products : 0;
    document.getElementById('sLow').textContent = h.lowStock != null ? h.lowStock : 0;
  }).catch(function(){});
</script>
</body>
</html>
