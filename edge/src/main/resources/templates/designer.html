<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="#{designer.title}">라벨 디자이너 · printscan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link th:href="@{/design/tokens.css}" rel="stylesheet">
  <link th:href="@{/design/components.css}" rel="stylesheet">
  <style>
    .wrap { max-width: var(--content-max); margin: 0 auto; padding: var(--space-lg); }
    .layout { display: grid; grid-template-columns: 1fr 340px; gap: var(--space-lg); }
    @media (max-width: 980px) { .layout { grid-template-columns: 1fr; } }
    .card { background: var(--color-canvas); border: var(--border-hairline); border-radius: var(--radius-lg); padding: var(--space-lg); margin-bottom: var(--space-lg); }
    .card h3 { margin: 0 0 var(--space-sm); font-size: var(--t-body-strong-size); font-weight: 600; }
    label { display:block; font-size: var(--t-caption-size); color: var(--color-ink-muted-80); margin: 6px 0 3px; }
    input, select, textarea { font-family: var(--font-text); font-size: var(--t-caption-size); border: var(--border-hairline); border-radius: var(--radius-sm); padding: 7px 9px; width: 100%; box-sizing: border-box; }
    .toolbar { display:flex; gap: var(--space-xs); flex-wrap: wrap; margin-bottom: var(--space-sm); }
    .chip-btn { background: var(--color-parchment); border: var(--border-hairline); border-radius: var(--radius-pill); padding: 6px 14px; font-size: var(--t-caption-size); cursor: pointer; }
    .chip-btn:active { transform: scale(var(--press-scale)); }
    .canvas-stage { background: var(--color-parchment); border-radius: var(--radius-md); padding: var(--space-lg); display:flex; justify-content:center; }
    #canvas { background:#fff; box-shadow: var(--shadow-product); cursor: default; touch-action: none; }
    .size-row { display:grid; grid-template-columns: 1fr 1fr 1fr; gap: var(--space-sm); }
    .muted { color: var(--color-ink-muted-48); font-size: var(--t-fine-print-size); }
    .prop-empty { color: var(--color-ink-muted-48); font-size: var(--t-caption-size); }
    .preview-box { background: var(--color-parchment); border-radius: var(--radius-md); min-height: 120px; display:flex; align-items:center; justify-content:center; padding: var(--space-sm); }
    .preview-box img { max-width: 100%; image-rendering: pixelated; background:#fff; box-shadow: var(--shadow-product); }
    .var-grid { display:grid; grid-template-columns: 1fr 1fr; gap: var(--space-xs); }
    .row2 { display:flex; gap: var(--space-xs); }
    .toast { position: fixed; bottom: 20px; right: 20px; background: var(--color-ink); color:#fff; padding: 12px 18px; border-radius: var(--radius-md); font-size: var(--t-caption-size); display:none; z-index: 50; }
    details.adv summary { cursor: pointer; font-size: var(--t-caption-size); color: var(--color-primary); }
    details.adv textarea { font-family: ui-monospace, Menlo, monospace; margin-top: 6px; }
  </style>
</head>
<body>

<nav class="global-nav">
  <strong style="font-size:14px;">▪ printscan</strong>
  <a th:href="@{/}" th:text="#{nav.home}">홈</a>
  <a th:href="@{/designer}" th:text="#{nav.designer}">라벨 디자이너</a>
  <a th:href="@{/scan}" th:text="#{nav.scan}">스캔·재고</a>
  <span class="spacer"></span>
  <span class="lang" style="font-size:var(--t-nav-link-size);">
    <a th:href="@{/designer(lang='ko')}" style="color:var(--color-primary);text-decoration:none;" th:style="${#locale.language=='ko'}?'text-decoration:underline;font-weight:600;color:var(--color-primary);'">KO</a>
    <span style="opacity:.4">·</span>
    <a th:href="@{/designer(lang='en')}" style="color:var(--color-primary);text-decoration:none;" th:style="${#locale.language=='en'}?'text-decoration:underline;font-weight:600;color:var(--color-primary);'">EN</a>
    <span style="opacity:.4">·</span>
    <a th:href="@{/designer(lang='vi')}" style="color:var(--color-primary);text-decoration:none;" th:style="${#locale.language=='vi'}?'text-decoration:underline;font-weight:600;color:var(--color-primary);'">VI</a>
    <span style="opacity:.4">·</span>
    <a th:href="@{/designer(lang='id')}" style="color:var(--color-primary);text-decoration:none;" th:style="${#locale.language=='id'}?'text-decoration:underline;font-weight:600;color:var(--color-primary);'">ID</a>
  </span>
</nav>

<div class="sub-nav">
  <span class="category">라벨 디자이너</span>
  <div class="links">
    <select id="tplSelect" style="width:190px;"><option value="" th:text="#{designer.savedTpl}">저장된 양식…</option></select>
    <button class="btn btn-dark-utility" id="btnSave" th:text="#{designer.save}">저장</button>
    <button class="btn btn-primary" id="btnPrint" th:text="#{designer.print}">인쇄</button>
  </div>
</div>

<div class="wrap">
  <div class="layout">
    <div>
      <div class="card">
        <div class="toolbar">
          <button class="chip-btn" data-add="TEXT" th:text="#{designer.add.text}">＋ 텍스트</button>
          <button class="chip-btn" data-add="QR" th:text="#{designer.add.qr}">＋ QR</button>
          <button class="chip-btn" data-add="DATAMATRIX" th:text="#{designer.add.datamatrix}">＋ DataMatrix</button>
          <button class="chip-btn" data-add="BARCODE" th:text="#{designer.add.barcode}">＋ 바코드</button>
          <button class="chip-btn" data-add="BOX" th:text="#{designer.add.box}">＋ 박스</button>
          <button class="chip-btn" id="btnDelSel" style="margin-left:auto;" th:text="#{designer.delSel}">선택 삭제</button>
        </div>
        <div class="canvas-stage">
          <canvas id="canvas" width="500" height="250"></canvas>
        </div>
        <div class="muted" style="margin-top:8px;" th:text="#{designer.help}">…</div>

        <div class="size-row" style="margin-top:var(--space-sm);">
          <div><label th:text="#{designer.tplName}">양식 이름</label><input id="name"></div>
          <div><label th:text="#{designer.w}">폭(mm)</label><input id="widthMm" type="number" value="40"></div>
          <div><label th:text="#{designer.h}">높이(mm)</label><input id="heightMm" type="number" value="25"></div>
        </div>
        <div class="size-row" style="margin-top:6px;">
          <div><label th:text="#{designer.dpi}">DPI</label><select id="dpi"><option value="203" selected>203</option><option value="300">300</option></select></div>
        </div>

        <details class="adv" style="margin-top:var(--space-sm);">
          <summary th:text="#{designer.adv}">고급 (개발자용)</summary>
          <textarea id="elementsJson" rows="8" spellcheck="false"></textarea>
          <button class="chip-btn" id="btnApplyJson" style="margin-top:6px;" th:text="#{designer.applyJson}">적용</button>
        </details>
      </div>
    </div>

    <div>
      <div class="card">
        <h3 th:text="#{designer.props}">속성</h3>
        <div id="props"><div class="prop-empty" th:text="#{designer.selectEl}">요소를 선택하세요.</div></div>
      </div>

      <div class="card">
        <h3 th:text="#{designer.preview}">인쇄 미리보기</h3> <span class="muted" th:text="#{designer.previewNote}"></span>
        <div class="preview-box"><img id="previewImg" style="display:none;"><span id="previewPh" class="muted" th:text="#{designer.autoRefresh}">자동 갱신</span></div>
      </div>

      <div class="card">
        <h3 th:text="#{designer.vars}">값(변수)</h3>
        <div id="varInputs" class="var-grid"><span class="muted" th:text="#{designer.varsNote}">…</span></div>
      </div>

      <div class="card">
        <h3 th:text="#{designer.printTitle}">인쇄</h3>
        <label th:text="#{designer.worker}">작업자 이름</label><input id="operator">
        <div class="row2" style="align-items:flex-end;margin-top:6px;">
          <div style="width:90px;"><label th:text="#{designer.copies}">매수</label><input id="copies" type="number" value="1" min="1"></div>
          <button class="btn btn-primary" id="btnPrint2" style="flex:1;" th:text="#{designer.print}">인쇄</button>
        </div>
        <button class="btn btn-dark-utility" id="btnDelete" style="margin-top:var(--space-xs);width:100%;" disabled th:text="#{designer.delTpl}">양식 삭제</button>
      </div>

      <div class="card">
        <h3 th:text="#{designer.batchTitle}">일련번호 연속</h3> <span class="muted" th:text="#{designer.batchNote}"></span>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;">
          <div><label th:text="#{designer.targetVar}">대상 값</label><input id="bSeqVar" value="code"></div>
          <div><label th:text="#{designer.prefix}">앞 글자</label><input id="bPrefix" value="NET-"></div>
          <div><label th:text="#{designer.start}">시작</label><input id="bStart" type="number" value="1"></div>
          <div><label th:text="#{designer.count}">개수</label><input id="bCount" type="number" value="5"></div>
          <div><label th:text="#{designer.pad}">자릿수</label><input id="bPad" type="number" value="4"></div>
        </div>
        <button class="btn btn-primary" id="btnBatch" style="margin-top:var(--space-sm);width:100%;" th:text="#{designer.batchBtn}">여러 장 인쇄</button>
        <div class="muted" style="margin-top:6px;" th:text="#{designer.batchHelp}">…</div>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>
<script th:src="@{/js/i18n.js}"></script>
<script th:src="@{/js/designer.js}"></script>
</body>
</html>
