spring.application.name=printscan-edge

# 로컬퍼스트: Pi 온디바이스 파일 DB (오프라인 완전동작, 순수 Java H2)
spring.datasource.url=jdbc:h2:file:./data/printscan;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
# 뷰 렌더 중 지연 쿼리 방지(경고 제거 + 트랜잭션 경계 명확화)
spring.jpa.open-in-view=false

server.port=8091

# ── 프린터 출력 경로 (구버전 PrintTransport 계승) ──
#  mode: network(LAN IP:9100) | cups(호스트 CUPS raw 큐) | rawdev(/dev/usb/lp0)
printscan.printer.mode=cups
printscan.printer.name=zebra,zd421
printscan.printer.host=
printscan.printer.port=9100
printscan.printer.device=/dev/usb/lp0
printscan.printer.timeout-ms=5000

# ── 라벨 래스터 엔진 ──
#  font-family: 리눅스 fontconfig로 해석(.25/Pi = Noto Sans CJK KR 설치됨).
#  font-path 지정 시 해당 TTF/TTC 직접 로드(우선). 미해석 시 SansSerif 폴백.
printscan.label.font-family=Noto Sans CJK KR
printscan.label.font-path=
printscan.label.default-dpi=203

# 미리보기 응답 캐시 방지
spring.web.resources.cache.cachecontrol.no-store=true

# ── 클라우드 동기화(P4) ──
#  enabled=true 면 클라우드에 등록·폴링(네트워크 출력)·하트비트(재고 업싱크).
printscan.cloud.enabled=false
printscan.cloud.base-url=http://localhost:8092
printscan.cloud.org-api-key=ORG-DEMO-KEY
printscan.cloud.device-name=edge-pi-01
printscan.cloud.poll-ms=2000
printscan.cloud.heartbeat-ms=15000

logging.level.com.printscan.edge=INFO
