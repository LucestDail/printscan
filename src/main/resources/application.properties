spring.application.name=printscan

# Server Configuration
server.port=8080
server.servlet.context-path=/

# MariaDB 설정
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver
spring.datasource.url=jdbc:mariadb://43.203.247.233:53306/baeksang
spring.datasource.username=baeksang
spring.datasource.password=baeksang

# JPA 설정
#  update: 기존 테이블/데이터 보존하며 누락 테이블·컬럼만 추가(label_template 자동 생성).
#  실데이터 세팅 후에는 validate 로 고정 권장. create-drop 은 재시작마다 전체 초기화이므로 금지.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# MyBatis 설정
mybatis.mapper-locations=classpath:mapper/**/*.xml
mybatis.type-aliases-package=com.baeksang.printscan.model
mybatis.configuration.map-underscore-to-camel-case=true

# Logging
logging.level.org.springframework.web=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.com.baeksang.printscan=DEBUG

# Security (개발 환경 설정)
spring.security.user.name=admin
spring.security.user.password=admin123

# CORS 설정
spring.web.cors.allowed-origins=*
spring.web.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS
spring.web.cors.allowed-headers=*

# Schema initialization
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema.sql

# 프린터 출력 경로 (.25 우분투 직결 — 금요일 세팅 시 조정)
#  mode: network(LAN IP:9100) | cups(호스트 CUPS raw 큐, 현행) | rawdev(/dev/usb/lp0)
printscan.printer.mode=cups
printscan.printer.name=zebra,zd421
printscan.printer.host=
printscan.printer.port=9100
printscan.printer.device=/dev/usb/lp0
printscan.printer.timeout-ms=5000

# JWT Configuration
jwt.secret=404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
jwt.expiration=86400000

# File Storage Configuration
file.upload-dir=./uploads
file.max-file-size=10485760
file.allowed-file-types=pdf,doc,docx,xls,xlsx,jpg,jpeg,png

# Multipart Configuration
spring.servlet.multipart.enabled=true
spring.servlet.multipart.file-size-threshold=2KB
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# QR Code Configuration
qrcode.expiration-minutes=30
qrcode.size=250
qrcode.max-active-codes=5

# Company Information
company.name=\uBC31\uC0C1\uC9C0\uC5C5
company.system.name=\uBC31\uC0C1\uC9C0\uC5C5 ERP

# Character Encoding
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true
server.servlet.encoding.force-request=true
server.servlet.encoding.force-response=true
spring.messages.encoding=UTF-8
spring.datasource.sql-script-encoding=UTF-8