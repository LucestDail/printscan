<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>라벨 디자이너 - ERP System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/@mdi/font@7.2.96/css/materialdesignicons.min.css" rel="stylesheet">
    <link href="/css/style.css" rel="stylesheet">
    <style>
        .label-preview {
            background: #f5f5f5;
            border: 1px dashed #bbb;
            min-height: 240px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px;
        }
        .label-preview img { max-width: 100%; height: auto; background: #fff; }
        #zplBody { font-family: monospace; font-size: 13px; }
        .element-row td { vertical-align: middle; }
        .element-row input, .element-row select { min-width: 0; }
    </style>
</head>
<body>
    <div class="wrapper">
        <div id="sidebar-container"></div>

        <div id="content">
            <div id="navbar-container"></div>

            <div class="container-fluid">
                <div class="row mb-3">
                    <div class="col d-flex justify-content-between align-items-center">
                        <h2 class="mb-0">라벨 디자이너</h2>
                        <div>
                            <select id="templateSelect" class="form-select d-inline-block" style="width:220px;">
                                <option value="">저장된 템플릿 불러오기…</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="row g-3">
                    <!-- 왼쪽: 설계 -->
                    <div class="col-lg-7">
                        <!-- 라벨 규격 -->
                        <div class="card mb-3">
                            <div class="card-body">
                                <h5 class="card-title">라벨 규격</h5>
                                <div class="row g-2">
                                    <div class="col-6 col-md-4">
                                        <label class="form-label">템플릿 이름</label>
                                        <input type="text" class="form-control" id="tplName" placeholder="예: 제품 기본 40x30">
                                    </div>
                                    <div class="col-4 col-md-2">
                                        <label class="form-label">폭(mm)</label>
                                        <input type="number" class="form-control" id="widthMm" value="40">
                                    </div>
                                    <div class="col-4 col-md-2">
                                        <label class="form-label">높이(mm)</label>
                                        <input type="number" class="form-control" id="heightMm" value="30">
                                    </div>
                                    <div class="col-4 col-md-2">
                                        <label class="form-label">DPI</label>
                                        <select class="form-select" id="dpi">
                                            <option value="203" selected>203</option>
                                            <option value="300">300</option>
                                        </select>
                                    </div>
                                    <div class="col-md-2 d-flex align-items-end">
                                        <span class="text-muted small" id="dotsHint"></span>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- 요소 -->
                        <div class="card mb-3">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <h5 class="card-title mb-0">요소</h5>
                                    <button type="button" class="btn btn-sm btn-outline-primary" id="addElement">
                                        <i class="mdi mdi-plus"></i> 요소 추가
                                    </button>
                                </div>
                                <p class="text-muted small mb-2">좌표(x,y)는 mm 기준. 값에 <code>{{키}}</code> 를 쓰면 인쇄 시 변수로 치환됩니다.</p>
                                <div class="table-responsive">
                                    <table class="table table-sm align-middle">
                                        <thead>
                                            <tr>
                                                <th style="width:110px;">종류</th>
                                                <th style="width:70px;">x(mm)</th>
                                                <th style="width:70px;">y(mm)</th>
                                                <th style="width:80px;">크기</th>
                                                <th>값</th>
                                                <th style="width:40px;"></th>
                                            </tr>
                                        </thead>
                                        <tbody id="elementBody"></tbody>
                                    </table>
                                </div>
                                <button type="button" class="btn btn-outline-secondary btn-sm" id="genZpl">
                                    <i class="mdi mdi-cog"></i> 요소 → ZPL 생성
                                </button>
                            </div>
                        </div>

                        <!-- ZPL 원문 -->
                        <div class="card">
                            <div class="card-body">
                                <h5 class="card-title">ZPL 원문 <small class="text-muted">(직접 편집 가능 · 미리보기/인쇄의 기준)</small></h5>
                                <textarea class="form-control" id="zplBody" rows="8" spellcheck="false">^XA
^PW320
^LL240
^FO20,20^A0N,28,28^FD{{name}}^FS
^FO20,70^BQN,2,6^FDLA,{{code}}^FS
^XZ</textarea>
                            </div>
                        </div>
                    </div>

                    <!-- 오른쪽: 미리보기/인쇄 -->
                    <div class="col-lg-5">
                        <div class="card mb-3">
                            <div class="card-body">
                                <div class="d-flex justify-content-between align-items-center mb-2">
                                    <h5 class="card-title mb-0">미리보기</h5>
                                    <button type="button" class="btn btn-sm btn-primary" id="btnPreview">
                                        <i class="mdi mdi-eye"></i> 미리보기
                                    </button>
                                </div>
                                <div class="label-preview mb-2">
                                    <img id="previewImg" alt="라벨 미리보기" style="display:none;">
                                    <span id="previewPlaceholder" class="text-muted">미리보기 버튼을 누르세요 (Labelary 렌더)</span>
                                </div>
                            </div>
                        </div>

                        <div class="card mb-3">
                            <div class="card-body">
                                <h5 class="card-title">변수 바인딩</h5>
                                <p class="text-muted small mb-2">ZPL의 <code>{{키}}</code> 를 감지해 값을 입력합니다.</p>
                                <div id="variableInputs" class="row g-2">
                                    <div class="col-12 text-muted small">감지된 변수가 없습니다.</div>
                                </div>
                            </div>
                        </div>

                        <div class="card mb-3">
                            <div class="card-body">
                                <h5 class="card-title">인쇄</h5>
                                <div class="d-flex align-items-end gap-2">
                                    <div>
                                        <label class="form-label">매수</label>
                                        <input type="number" class="form-control" id="copies" value="1" min="1" style="width:90px;">
                                    </div>
                                    <button type="button" class="btn btn-success flex-grow-1" id="btnPrint">
                                        <i class="mdi mdi-printer"></i> 인쇄 (변수 치환 후 전송)
                                    </button>
                                </div>
                                <p class="text-muted small mt-2 mb-0">활성 프린터 mode 는 서버 <code>printscan.printer.mode</code> 설정을 따릅니다.</p>
                            </div>
                        </div>

                        <div class="card">
                            <div class="card-body d-flex gap-2">
                                <button type="button" class="btn btn-outline-primary flex-grow-1" id="btnSave">
                                    <i class="mdi mdi-content-save"></i> 템플릿 저장
                                </button>
                                <button type="button" class="btn btn-outline-danger" id="btnDelete" disabled>
                                    <i class="mdi mdi-delete"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="toast-container" class="toast-container position-fixed bottom-0 end-0 p-3"></div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/common.js"></script>
    <script src="/js/label-designer.js"></script>
</body>
</html>
