spring.application.name=printscan-cloud
server.port=8092

# i18n (ko 기본 + en)
spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

spring.datasource.url=jdbc:h2:file:./data/cloud;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.jpa.open-in-view=false

# 데모 부트스트랩: 기본 조직 자동 생성(고정 apiKey) — 디바이스 등록용
printscan.cloud.bootstrap-org=기본조직
printscan.cloud.bootstrap-api-key=ORG-DEMO-KEY

logging.level.com.printscan.cloud=INFO
