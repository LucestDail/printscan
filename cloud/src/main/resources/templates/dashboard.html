<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org" th:lang="${#locale.language}">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title th:text="#{dash.title}">printscan hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link th:href="@{/design/tokens.css}" rel="stylesheet">
  <link th:href="@{/design/components.css}" rel="stylesheet">
  <style>
    .wrap { max-width: var(--content-max); margin: 0 auto; padding: var(--space-lg); }
    .stats { display:grid; grid-template-columns: repeat(4,1fr); gap: var(--space-lg); margin-bottom: var(--space-lg); }
    @media (max-width:800px){ .stats{grid-template-columns:repeat(2,1fr);} }
    .stat { background: var(--color-canvas); border: var(--border-hairline); border-radius: var(--radius-lg); padding: var(--space-lg); }
    .stat .n { font-family: var(--font-display); font-size: 40px; font-weight: 600; }
    .stat .l { color: var(--color-ink-muted-48); font-size: var(--t-caption-size); }
    .layout { display:grid; grid-template-columns: 1fr 380px; gap: var(--space-lg); }
    @media (max-width:900px){ .layout{grid-template-columns:1fr;} }
    .card { background: var(--color-canvas); border: var(--border-hairline); border-radius: var(--radius-lg); padding: var(--space-lg); margin-bottom: var(--space-lg); }
    .card h3 { margin:0 0 var(--space-sm); font-size: var(--t-body-strong-size); font-weight:600; }
    table { width:100%; border-collapse:collapse; font-size: var(--t-caption-size); }
    th,td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--color-hairline); }
    .dot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:6px; }
    .dot.on { background:#2ecc71; } .dot.off { background:#c0392b; }
    .badge { font-size: var(--t-fine-print-size); padding:2px 8px; border-radius: var(--radius-pill); }
    .badge.QUEUED{background:#fff3cd;color:#8a6d00;} .badge.SENT{background:#e6f3ff;color:var(--color-primary);}
    .badge.DONE{background:#e8f8ee;color:#1e8449;} .badge.FAILED{background:#ffe9e9;color:#c0392b;}
    label{display:block;font-size:var(--t-caption-size);color:var(--color-ink-muted-80);margin:6px 0 3px;}
    input,select,textarea{font-family:var(--font-text);font-size:var(--t-caption-size);border:var(--border-hairline);border-radius:var(--radius-sm);padding:7px 9px;width:100%;box-sizing:border-box;}
    textarea{font-family:ui-monospace,Menlo,monospace;}
    .muted{color:var(--color-ink-muted-48);font-size:var(--t-fine-print-size);}
    .toast{position:fixed;bottom:20px;right:20px;background:var(--color-ink);color:#fff;padding:12px 18px;border-radius:var(--radius-md);font-size:var(--t-caption-size);display:none;z-index:50;}
    .lang a { color: var(--color-primary); text-decoration:none; font-size: var(--t-nav-link-size); }
    .lang a.on { font-weight:600; text-decoration:underline; }
  </style>
</head>
<body>

<nav class="global-nav">
  <strong style="font-size:14px;">▪ printscan <span style="opacity:.6;">hub</span></strong>
  <span class="spacer"></span>
  <span class="t-fine-print" style="opacity:.7;margin-right:14px;" th:text="#{brand.sub}">통합 관리</span>
  <a th:href="@{/login}" style="color:var(--color-body-on-dark);text-decoration:none;font-size:var(--t-nav-link-size);margin-right:10px;opacity:.85;" th:text="#{login.h1}">조직</a>
  <a href="#" id="navLogout" style="color:var(--color-body-on-dark);text-decoration:none;font-size:var(--t-nav-link-size);margin-right:14px;opacity:.85;" th:text="#{nav.logout}">로그아웃</a>
  <span class="lang">
    <a th:href="@{/(lang='ko')}" th:classappend="${#locale.language=='ko'}?'on'">KO</a>
    <span style="opacity:.4">·</span>
    <a th:href="@{/(lang='en')}" th:classappend="${#locale.language=='en'}?'on'">EN</a>
  </span>
</nav>

<section class="tile tile-light" style="padding: var(--space-xl) var(--space-lg);">
  <h1 class="t-display-lg headline" style="margin:0;" th:text="#{dash.h1}">장비 현황</h1>
  <p class="t-lead tagline" style="margin:6px 0 0;" th:text="#{dash.sub}">…</p>
</section>

<div class="wrap">
  <div class="stats">
    <div class="stat"><div class="n" id="sDevices">–</div><div class="l" th:text="#{stat.devices}">장비</div></div>
    <div class="stat"><div class="n" id="sOnline">–</div><div class="l" th:text="#{stat.online}">온라인</div></div>
    <div class="stat"><div class="n" id="sPrinted">–</div><div class="l" th:text="#{stat.printed}">누적 인쇄</div></div>
    <div class="stat"><div class="n" id="sQueued">–</div><div class="l" th:text="#{stat.queued}">대기 작업</div></div>
  </div>

  <div class="layout">
    <div>
      <div class="card">
        <h3 th:text="#{dev.title}">장비</h3>
        <table><thead><tr>
          <th th:text="#{dev.h.status}">상태</th><th th:text="#{dev.h.id}">ID</th><th th:text="#{dev.h.name}">이름</th>
          <th th:text="#{dev.h.line}">라인</th><th th:text="#{dev.h.printer}">프린터</th>
          <th th:text="#{dev.h.printCount}">인쇄수</th><th th:text="#{dev.h.lastSeen}">최근접속</th>
        </tr></thead><tbody id="devBody"></tbody></table>
      </div>
      <div class="card">
        <h3 th:text="#{consume.title}">사용량</h3>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:var(--space-md);">
          <div><div class="muted" style="margin-bottom:4px;" th:text="#{consume.byLine}">라인별</div><table><tbody id="cByLine"></tbody></table></div>
          <div><div class="muted" style="margin-bottom:4px;" th:text="#{consume.byOperator}">작업자별</div><table><tbody id="cByOp"></tbody></table></div>
          <div><div class="muted" style="margin-bottom:4px;" th:text="#{consume.byProduct}">제품별</div><table><tbody id="cByProd"></tbody></table></div>
        </div>
        <div class="muted" style="margin-top:6px;"><span th:text="#{consume.total}">총 사용량</span>: <b id="cTotal">0</b></div>
      </div>
      <div class="card">
        <h3 th:text="#{stock.title}">재고</h3>
        <table><thead><tr><th th:text="#{stock.h.device}">장비</th><th th:text="#{stock.h.code}">코드</th><th th:text="#{stock.h.name}">이름</th><th th:text="#{stock.h.qty}">수량</th></tr></thead><tbody id="snapBody"></tbody></table>
      </div>
      <div class="card">
        <h3 th:text="#{jobs.title}">최근 인쇄 작업</h3>
        <table><thead><tr><th th:text="#{jobs.h.num}">#</th><th th:text="#{jobs.h.device}">장비</th><th th:text="#{jobs.h.status}">상태</th><th th:text="#{jobs.h.message}">메시지</th></tr></thead><tbody id="jobBody"></tbody></table>
      </div>
    </div>

    <div>
      <div class="card">
        <h3 th:text="#{net.title}">원격 인쇄 지시</h3>
        <label th:text="#{net.device}">대상 장비</label>
        <select id="npDevice"></select>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;">
          <div><label th:text="#{net.w}">폭</label><input id="npW" type="number" value="40"></div>
          <div><label th:text="#{net.h}">높이</label><input id="npH" type="number" value="25"></div>
          <div><label th:text="#{net.dpi}">해상도</label><input id="npDpi" type="number" value="203"></div>
        </div>
        <label th:text="#{net.elements}">라벨 요소</label>
        <textarea id="npElements" rows="7"></textarea>
        <label th:text="#{net.vars}">값</label>
        <div style="display:flex;gap:8px;">
          <input id="npName" placeholder="name" value="클라우드 인쇄">
          <input id="npCode" placeholder="code" value="NET-0001">
        </div>
        <label th:text="#{net.copies}">매수</label><input id="npCopies" type="number" value="1" min="1">
        <div style="border-top:1px solid var(--color-hairline);margin:var(--space-sm) 0;padding-top:var(--space-sm);">
          <label th:text="#{net.batchTitle}">일련번호 연속</label>
          <div style="display:grid;grid-template-columns:1fr 1fr 1fr 1fr 1fr;gap:6px;">
            <input id="npSeqVar" th:placeholder="#{net.seqVar}" value="code">
            <input id="npPrefix" th:placeholder="#{net.prefix}" value="NET-">
            <input id="npStart" type="number" th:placeholder="#{net.start}" value="1">
            <input id="npCount" type="number" th:placeholder="#{net.count}" value="1">
            <input id="npPad" type="number" th:placeholder="#{net.pad}" value="4">
          </div>
        </div>
        <button class="btn btn-primary" id="btnNetPrint" style="margin-top:var(--space-sm);width:100%;" th:text="#{net.btn}">이 장비로 인쇄</button>
        <div class="muted" style="margin-top:6px;" th:text="#{net.note}">…</div>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>
<script th:src="@{/js/i18n.js}"></script>
<script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
