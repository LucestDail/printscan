<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>printscan cloud · 통합 대시보드</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link th:href="@{/design/tokens.css}" rel="stylesheet">
  <link th:href="@{/design/components.css}" rel="stylesheet">
  <style>
    .wrap { max-width: var(--content-max); margin: 0 auto; padding: var(--space-lg); }
    .stats { display:grid; grid-template-columns: repeat(4,1fr); gap: var(--space-lg); margin-bottom: var(--space-lg); }
    @media (max-width:800px){ .stats{grid-template-columns:repeat(2,1fr);} }
    .stat { background: var(--color-canvas); border: var(--border-hairline); border-radius: var(--radius-lg); padding: var(--space-lg); }
    .stat .n { font-family: var(--font-display); font-size: 40px; font-weight: 600; }
    .stat .l { color: var(--color-ink-muted-48); font-size: var(--t-caption-size); }
    .layout { display:grid; grid-template-columns: 1fr 380px; gap: var(--space-lg); }
    @media (max-width:900px){ .layout{grid-template-columns:1fr;} }
    .card { background: var(--color-canvas); border: var(--border-hairline); border-radius: var(--radius-lg); padding: var(--space-lg); margin-bottom: var(--space-lg); }
    .card h3 { margin:0 0 var(--space-sm); font-size: var(--t-body-strong-size); font-weight:600; }
    table { width:100%; border-collapse:collapse; font-size: var(--t-caption-size); }
    th,td { text-align:left; padding:6px 8px; border-bottom:1px solid var(--color-hairline); }
    .dot { width:8px; height:8px; border-radius:50%; display:inline-block; margin-right:6px; }
    .dot.on { background:#2ecc71; } .dot.off { background:#c0392b; }
    .badge { font-size: var(--t-fine-print-size); padding:2px 8px; border-radius: var(--radius-pill); }
    .badge.QUEUED{background:#fff3cd;color:#8a6d00;} .badge.SENT{background:#e6f3ff;color:var(--color-primary);}
    .badge.DONE{background:#e8f8ee;color:#1e8449;} .badge.FAILED{background:#ffe9e9;color:#c0392b;}
    label{display:block;font-size:var(--t-caption-size);color:var(--color-ink-muted-80);margin:6px 0 3px;}
    input,select,textarea{font-family:var(--font-text);font-size:var(--t-caption-size);border:var(--border-hairline);border-radius:var(--radius-sm);padding:7px 9px;width:100%;box-sizing:border-box;}
    textarea{font-family:ui-monospace,Menlo,monospace;}
    .muted{color:var(--color-ink-muted-48);font-size:var(--t-fine-print-size);}
    .toast{position:fixed;bottom:20px;right:20px;background:var(--color-ink);color:#fff;padding:12px 18px;border-radius:var(--radius-md);font-size:var(--t-caption-size);display:none;z-index:50;}
  </style>
</head>
<body>

<nav class="global-nav">
  <strong style="font-size:14px;">▪ printscan <span style="opacity:.6;">cloud</span></strong>
  <span class="spacer"></span>
  <span class="t-fine-print" style="opacity:.7;">통합 관리 · 네트워크 출력</span>
</nav>

<section class="tile tile-light" style="padding: var(--space-xl) var(--space-lg);">
  <h1 class="t-display-lg headline" style="margin:0;">플릿 대시보드</h1>
  <p class="t-lead tagline" style="margin:6px 0 0;">모든 디바이스의 출력·재고를 한 곳에서. 원격으로 인쇄를 지시하세요.</p>
</section>

<div class="wrap">
  <div class="stats">
    <div class="stat"><div class="n" id="sDevices">–</div><div class="l">디바이스</div></div>
    <div class="stat"><div class="n" id="sOnline">–</div><div class="l">온라인</div></div>
    <div class="stat"><div class="n" id="sPrinted">–</div><div class="l">누적 인쇄</div></div>
    <div class="stat"><div class="n" id="sQueued">–</div><div class="l">대기 잡</div></div>
  </div>

  <div class="layout">
    <div>
      <div class="card">
        <h3>디바이스</h3>
        <table><thead><tr><th>상태</th><th>ID</th><th>이름</th><th>mode</th><th>인쇄수</th><th>최근접속</th></tr></thead><tbody id="devBody"></tbody></table>
      </div>
      <div class="card">
        <h3>재고(디바이스 업싱크)</h3>
        <table><thead><tr><th>디바이스</th><th>코드</th><th>이름</th><th>수량</th></tr></thead><tbody id="snapBody"></tbody></table>
      </div>
      <div class="card">
        <h3>최근 인쇄 잡</h3>
        <table><thead><tr><th>#</th><th>디바이스</th><th>상태</th><th>메시지</th></tr></thead><tbody id="jobBody"></tbody></table>
      </div>
    </div>

    <div>
      <div class="card">
        <h3>네트워크 출력 지시</h3>
        <label>대상 디바이스</label>
        <select id="npDevice"></select>
        <div style="display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;">
          <div><label>폭(mm)</label><input id="npW" type="number" value="40"></div>
          <div><label>높이(mm)</label><input id="npH" type="number" value="25"></div>
          <div><label>DPI</label><input id="npDpi" type="number" value="203"></div>
        </div>
        <label>요소 JSON</label>
        <textarea id="npElements" rows="7"></textarea>
        <label>변수 (name, code)</label>
        <div style="display:flex;gap:8px;">
          <input id="npName" placeholder="name" value="클라우드 인쇄">
          <input id="npCode" placeholder="code" value="NET-0001">
        </div>
        <label>매수</label><input id="npCopies" type="number" value="1" min="1">
        <button class="btn btn-primary" id="btnNetPrint" style="margin-top:var(--space-sm);width:100%;">이 디바이스로 인쇄</button>
        <div class="muted" style="margin-top:6px;">지시 → 디바이스가 폴링해 로컬 인쇄 → 결과 집계 반영.</div>
      </div>
    </div>
  </div>
</div>

<div id="toast" class="toast"></div>
<script th:src="@{/js/dashboard.js}"></script>
</body>
</html>
