# SaaS 운영 프로필: --spring.profiles.active=prod (env 로 DB 주입)
# 온프렘 기본은 application.properties(H2 file). prod 는 Postgres.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/printscan}
spring.datasource.username=${DB_USER:printscan}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# 스키마: Flyway 가 마이그레이션, Hibernate 는 검증만(불일치 시 부팅 실패 = 안전).
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.h2.console.enabled=false

# SaaS 보안: admin-token 필수 설정(테넌트별 org-key 와 별개로 플랫폼 게이트)
printscan.hub.mode=saas
